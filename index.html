<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANISKA MONDAL GAME HUB - Pro 3 Guti</title>
    <!-- PeerJS for WebRTC real-time connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2e0854, #120224);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #ffde59;
            text-shadow: 0 0 10px #ff914d, 0 0 20px #ff3131;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #00f2fe;
            margin-top: 3px;
            font-weight: bold;
        }

        /* Player Status Bars */
        .status-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
        }
        .player-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background: #ff2a55; box-shadow: 0 0 8px #ff2a55; }
        .dot-blue { background: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
        
        .connection-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
            background: #2a2a2a;
        }
        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #777;
        }
        .conn-dot.online {
            background: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        /* Invite Controls */
        .controls {
            width: 100%;
            max-width: 360px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
        }
        .share-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .share-btn:active { transform: scale(0.98); }

        /* Turn Indicator Message */
        .turn-announcer {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 25px;
            text-align: center;
            color: #ffde59;
            transition: all 0.3s ease;
        }

        /* Game Board Canvas-like Area */
        .board-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: #211134;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 15px rgba(255,255,255,0.05);
            border: 4px solid #ffbe0b;
        }

        /* SVG Board Lines */
        svg.board-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        line {
            stroke: #fffae6;
            stroke-width: 5;
            stroke-linecap: round;
        }

        /* Positions / Nodes */
        .node {
            position: absolute;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #140b20;
            border: 3px solid #ffbe0b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .node.valid-target {
            border-color: #00ff66;
            box-shadow: 0 0 15px #00ff66;
            animation: breathe 1s infinite alternate;
        }
        @keyframes breathe {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* Beads / Gutis */
        .guti {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }
        .guti-red {
            background: radial-gradient(circle at 35% 35%, #ff7b92, #d90429 70%, #59000d);
            border: 2px solid #fff;
        }
        .guti-blue {
            background: radial-gradient(circle at 35% 35%, #80e5ff, #0077b6 70%, #002855);
            border: 2px solid #fff;
        }

        .node.selected {
            border-color: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }
        .node.selected .guti {
            transform: scale(1.25);
        }

        /* Board overlay when not your turn */
        .board-locked {
            pointer-events: none !important;
            opacity: 0.9;
        }

        /* Game Rules Footnote */
        .guide-box {
            width: 100%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px 12px;
            margin-top: 15px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #d1d1d1;
        }
    </style>
</head>
<body>

    <header>
        <h1>TANISKA MONDAL GAME HUB</h1>
        <div class="subtitle">বাঙালি তিন গুটি (Tin Guti Online)</div>
    </header>

    <!-- Top Connection & Turn Badges -->
    <div class="status-container">
        <div class="player-badge">
            <span class="dot dot-red"></span>
            <span>বাবা (Red)</span>
        </div>
        <div class="connection-indicator">
            <span id="conn-led" class="conn-dot"></span>
            <span id="conn-text">অফলাইন</span>
        </div>
        <div class="player-badge">
            <span>তানিস্কা (Blue)</span>
            <span class="dot dot-blue"></span>
        </div>
    </div>

    <!-- Invite Control -->
    <div class="controls" id="invite-panel">
        <button class="share-btn" onclick="shareGameLink()">🔗 মেয়ের জন্য গেমের লিংক কপি করুন</button>
    </div>

    <!-- Live Turn Announcement -->
    <div class="turn-announcer" id="turn-announcer">কানেক্ট হওয়ার অপেক্ষা করা হচ্ছে...</div>

    <!-- Game Board -->
    <div class="board-container" id="board-container">
        <!-- SVG lines linking traditional Tin Guti points -->
        <svg class="board-lines" viewBox="0 0 320 320">
            <!-- Outer Square -->
            <line x1="40" y1="40" x2="280" y2="40" />
            <line x1="280" y1="40" x2="280" y2="280" />
            <line x1="280" y1="280" x2="40" y2="280" />
            <line x1="40" y1="280" x2="40" y2="40" />
            <!-- Middle Cross -->
            <line x1="40" y1="160" x2="280" y2="160" />
            <line x1="160" y1="40" x2="160" y2="280" />
            <!-- Diagonals -->
            <line x1="40" y1="40" x2="280" y2="280" />
            <line x1="280" y1="40" x2="40" y2="280" />
        </svg>

        <!-- 9 Points / Intersections of Tin Guti -->
        <div class="node" id="n0" style="top: 40px; left: 40px;" onclick="handleCellClick(0)"></div>
        <div class="node" id="n1" style="top: 40px; left: 160px;" onclick="handleCellClick(1)"></div>
        <div class="node" id="n2" style="top: 40px; left: 280px;" onclick="handleCellClick(2)"></div>
        <div class="node" id="n3" style="top: 160px; left: 40px;" onclick="handleCellClick(3)"></div>
        <div class="node" id="n4" style="top: 160px; left: 160px;" onclick="handleCellClick(4)"></div>
        <div class="node" id="n5" style="top: 160px; left: 280px;" onclick="handleCellClick(5)"></div>
        <div class="node" id="n6" style="top: 280px; left: 40px;" onclick="handleCellClick(6)"></div>
        <div class="node" id="n7" style="top: 280px; left: 160px;" onclick="handleCellClick(7)"></div>
        <div class="node" id="n8" style="top: 280px; left: 280px;" onclick="handleCellClick(8)"></div>
    </div>

    <div class="guide-box">
        💡 <b>নিয়ম:</b> ৩টি লাল ও ৩টি নীল গুটি দুই প্রান্তে শুরু থেকেই থাকবে। নিজের গুটি চালার জন্য ক্লিক করুন, তারপর পাশের খালি ঘরে চাপ দিন। যাঁর ৩টি গুটি এক লাইনে আসবে তিনি বিজয়ী!
    </div>

    <script>
        // Adjacent point connections in 3 Guti board
        const ADJACENT_POINTS = {
            0: [1, 3, 4],
            1: [0, 2, 4],
            2: [1, 4, 5],
            3: [0, 4, 6],
            4: [0, 1, 2, 3, 5, 6, 7, 8], // Center connects to all 8 points
            5: [2, 4, 8],
            6: [3, 4, 7],
            7: [4, 6, 8],
            8: [4, 5, 7]
        };

        const WIN_PATTERNS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontal rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertical columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        let peer = null;
        let conn = null;
        let myRole = null; // 'RED' (Baba) or 'BLUE' (Taniska)
        let selectedNode = null;

        // Default Authentic Tin Guti Setup:
        // Top row (0,1,2) = RED, Bottom row (6,7,8) = BLUE, Center & sides (3,4,5) = empty
        let gameState = {
            board: ['RED', 'RED', 'RED', null, null, null, 'BLUE', 'BLUE', 'BLUE'],
            turn: 'RED',
            winner: null
        };

        // Initialize Peer connection
        function initNetwork() {
            peer = new Peer();

            peer.on('open', id => {
                const urlParams = new URLSearchParams(window.location.search);
                const joinId = urlParams.get('game');

                if (joinId) {
                    // Someone opened the shared link -> becomes BLUE
                    myRole = 'BLUE';
                    conn = peer.connect(joinId);
                    setupConnectionListeners();
                } else {
                    // Host created the game -> becomes RED
                    myRole = 'RED';
                }
            });

            // If someone connects to host
            peer.on('connection', connection => {
                conn = connection;
                setupConnectionListeners();
            });
        }

        function setupConnectionListeners() {
            conn.on('open', () => {
                setOnline(true);
                if (myRole === 'RED') {
                    // Sync initial board with player 2
                    conn.send(gameState);
                }
                updateUI();
            });

            conn.on('data', data => {
                gameState = data;
                selectedNode = null;
                updateUI();
            });

            conn.on('close', () => {
                setOnline(false);
                document.getElementById('turn-announcer').innerText = "সংযোগ বিচ্ছিন্ন হয়েছে!";
            });
        }

        function setOnline(isOnline) {
            const led = document.getElementById('conn-led');
            const txt = document.getElementById('conn-text');
            if (isOnline) {
                led.className = 'conn-dot online';
                txt.innerText = 'অনলাইন';
                txt.style.color = '#00ff66';
            } else {
                led.className = 'conn-dot';
                txt.innerText = 'অফলাইন';
                txt.style.color = '#777';
            }
        }

        // Link Share logic for Daughter
        function shareGameLink() {
            if (!peer || !peer.id) {
                alert("কানেকশন তৈরি হচ্ছে, ১ সেকেন্ড অপেক্ষা করুন...");
                return;
            }
            const gameUrl = `${window.location.origin}${window.location.pathname}?game=${peer.id}`;
            navigator.clipboard.writeText(gameUrl).then(() => {
                alert("গেমের লিংক কপি হয়েছে! আপনার মেয়েকে WhatsApp বা মেসেঞ্জারে পাঠিয়ে দিন।");
            }).catch(() => {
                prompt("এই লিংকটি কপি করে আপনার মেয়েকে দিন:", gameUrl);
            });
        }

        // Handle Board interaction
        function handleCellClick(index) {
            if (gameState.winner) return;
            if (!conn || !conn.open) {
                alert("আপনার মেয়ে এখনও অনলাইন যুক্ত হয়নি! লিংকটি তাকে পাঠান।");
                return;
            }

            // Ludo-like lock: strictly forbid interaction when not your turn
            if (gameState.turn !== myRole) {
                return;
            }

            const currentCell = gameState.board[index];

            // Step 1: Select own bead
            if (selectedNode === null) {
                if (currentCell === myRole) {
                    selectedNode = index;
                    highlightOptions(index);
                }
            } 
            // Step 2: Move to an adjacent empty node or change selection
            else {
                if (index === selectedNode) {
                    // Deselect if clicked same bead again
                    clearHighlight();
                    selectedNode = null;
                } else if (currentCell === myRole) {
                    // Switch selection to another own bead
                    selectedNode = index;
                    highlightOptions(index);
                } else if (currentCell === null && ADJACENT_POINTS[selectedNode].includes(index)) {
                    // Legal move executed!
                    gameState.board[index] = myRole;
                    gameState.board[selectedNode] = null;
                    selectedNode = null;
                    clearHighlight();

                    // Check win condition
                    if (checkWin(myRole)) {
                        gameState.winner = myRole;
                    } else {
                        // Switch turn
                        gameState.turn = (myRole === 'RED') ? 'BLUE' : 'RED';
                    }

                    // Sync state instantly to opponent
                    conn.send(gameState);
                    updateUI();
                }
            }
        }

        function highlightOptions(sourceIndex) {
            clearHighlight();
            document.getElementById(`n${sourceIndex}`).classList.add('selected');

            // Highlight adjacent available empty nodes
            ADJACENT_POINTS[sourceIndex].forEach(target => {
                if (gameState.board[target] === null) {
                    document.getElementById(`n${target}`).classList.add('valid-target');
                }
            });
        }

        function clearHighlight() {
            for (let i = 0; i < 9; i++) {
                const node = document.getElementById(`n${i}`);
                node.classList.remove('selected', 'valid-target');
            }
        }

        function checkWin(player) {
            return WIN_PATTERNS.some(combo => 
                combo.every(index => gameState.board[index] === player)
            );
        }

        // Render Board, Pieces & Locks
        function updateUI() {
            const boardContainer = document.getElementById('board-container');
            const announcer = document.getElementById('turn-announcer');

            // Render beads
            for (let i = 0; i < 9; i++) {
                const cell = document.getElementById(`n${i}`);
                cell.innerHTML = '';
                if (gameState.board[i] === 'RED') {
                    cell.innerHTML = '<div class="guti guti-red"></div>';
                } else if (gameState.board[i] === 'BLUE') {
                    cell.innerHTML = '<div class="guti guti-blue"></div>';
                }
            }

            // Winner state
            if (gameState.winner) {
                boardContainer.classList.add('board-locked');
                if (gameState.winner === myRole) {
                    announcer.innerHTML = "🏆 অভিনন্দন! আপনি জিতে গেছেন! 🏆";
                    announcer.style.color = "#00ff66";
                } else {
                    announcer.innerHTML = (myRole === 'RED' ? "তানিস্কা" : "বাবা") + " জিতে গেছে! 🥳";
                    announcer.style.color = "#00d2ff";
                }
                return;
            }

            // Lock controls if not user's turn
            if (gameState.turn === myRole) {
                boardContainer.classList.remove('board-locked');
                announcer.innerText = "🎲 আপনার চাল! নিজের গুটি বেছে চালুন।";
                announcer.style.color = "#00ff66";
            } else {
                boardContainer.classList.add('board-locked');
                const opponentName = (myRole === 'RED') ? "তানিস্কার" : "বাবার";
                announcer.innerText = `⏳ ${opponentName} চালের জন্য অপেক্ষা করুন...`;
                announcer.style.color = "#ffde59";
            }
        }

        // Run network setup on page load
        window.onload = initNetwork;
    </script>
</body>
</html>
